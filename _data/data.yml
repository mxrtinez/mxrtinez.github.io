career-profile:
    title: Career Profile
    summary: |
      Systems administrator and PhD student specializing in Workflows, Computing Continuum, Open Science, and data management. I manage research platforms that enhance collaboration and reproducibility, combining technical expertise with advanced research skills.
education:
    title: Education
    info:
      - degree: Doctorate in Computer Science
        university: Universidad Industrial de Santander
        time: 2024 - Present
        details: |
          Optimization of workflows for the management of large volumes of data in large-scale scientific applications.
      - degree: MSc in Systems and computer engineering
        university: Universidad Industrial de Santander
        time: 2023
        details: |
          A methodological model was developed to assist and enhance the reproducibility of scientific experiments in small and/or medium research groups. The model was validated through use cases on the Milab platform.
      - degree: BSc in Systems and computer engineering
        university: Universidad Industrial de Santander
        time: 2017
        details: |
          Implementation of the DSpace data repository in a decentralised way, including discovery and data transmission protocols for the LAGO Collaboration.

experiences:
    title: Experiences
    info:
      - role: Software architect and systems administrator
        time: 2025 - Present
        company: EL-BONGÓ physics
        details: |
          Design, deploy and administer the ElBongo Science Gateway, a platform that integrates workflows, data management tools, and computing resources to support research under open science principles. 
          Support users in the use of the Science Gateway, facilitating the execution, monitoring, and reproducibility of computational experiments. 
          Manage and extend the workflow management services that enable researchers to design, share, and reuse workflows across distributed computing infrastructures. https://elbongo.redclara.net/
      - role: Software architect and systems administrator
        time: 2020 - 2024
        company: LA-CoNGA physics
        details: |
          Design, deploy and administer the MiLab platform, available at the URL https://milab.redclara.net/. This platform provides research support in data management, software, scientific computing and communications, following open science principles.
          Manage and support the LA-CoNGA Courses learning content management system, LCMS https://laconga.redclara.net/courses/
      - role: Young Researcher
        time: 2019 - 2020
        company: Minciencias - Universidad Industrial de Santander
        details: |
          Design of a repository network based on ckan software for meteorological data management.
      - role: Data Curator
        time: 2018
        company: Corporación Latinoaméricana de Redes Avanzadas (RedCLARA)
        details: |
          Implementation of a prototype for an open scientific data repository, with functionalities for interoperability, persistent digital identifiers, dissemination, and metadata collection.

